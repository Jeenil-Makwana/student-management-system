<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Student Management System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="assets/js/core.js"></script>
  <style>
    * {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: "Poppins", sans-serif;
}

section {
  position: relative;
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  min-height: 100vh;
  padding: 20px 0;
  overflow: hidden;
}

section .bg {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  pointer-events: none;
}

section .trees {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  z-index: 100;
  pointer-events: none;
}

section .girl {
  position: absolute;
  scale: 0.65;
  pointer-events: none;
  animation: animateGirl 10s linear infinite;
}

@keyframes animateGirl {
  0% {
    transform: translateX(calc(100% + 100vw));
  }
  50% {
    transform: translateX(calc(-100% - 100vw));
  }
  50.01% {
    transform: translateX(calc(-100% - 100vw)) rotateY(180deg);
  }
  100% {
    transform: translateX(calc(100% + 100vw)) rotateY(180deg);
  }
}

.login {
  position: relative;
  padding: 40px 50px;
  background: rgba(255, 255, 255, 0.35);
  backdrop-filter: blur(15px);
  border: 1px solid #fff;
  border-bottom: 1px solid rgba(255, 255, 255, 0.5);
  border-right: 1px solid rgba(255, 255, 255, 0.5);
  border-radius: 20px;
  width: 520px;
  max-width: 95vw;
  display: flex;
  flex-direction: column;
  gap: 18px;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.15);
  z-index: 10;
}

.login h2 {
  position: relative;
  width: 100%;
  text-align: center;
  font-size: 2.2em;
  font-weight: 700;
  color: #8f2c24;
}

.login .inputBox {
  position: relative;
}

.login .inputBox input {
  position: relative;
  width: 100%;
  padding: 12px 18px;
  outline: none;
  font-size: 1.05em;
  color: #8f2c24;
  border-radius: 8px;
  background: #fff;
  border: none;
  margin-bottom: 15px;
}

.login .inputBox ::placeholder {
  color: #8f2c24;
}

.login .inputBox #btn {
  position: relative;
  border: none;
  outline: none;
  background: #8f2c24;
  color: #fff;
  cursor: pointer;
  font-size: 1.15em;
  font-weight: 600;
  transition: 0.3s;
  border-radius: 8px;
  margin-bottom: 0px;
}

.login .inputBox #btn:hover {
  background: #d64c42;
}

.login .group {
  display: flex;
  justify-content: space-between;
}

.login .group a {
  font-size: 0.95em;
  color: #8f2c24;
  font-weight: 600;
  text-decoration: none;
}

.login .group a:nth-child(2) {
  text-decoration: underline;
}

.demo-box {
  background: rgba(255, 255, 255, 0.65);
  border-radius: 12px;
  padding: 12px 16px;
  border: 1px solid rgba(255,255,255,0.8);
}
.demo-title {
  font-size: 0.8em;
  font-weight: 700;
  color: #8f2c24;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  margin-bottom: 8px;
  text-align: center;
}
.demo-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
}
.demo-btn {
  background: #8f2c24;
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 0.78em;
  font-weight: 600;
  cursor: pointer;
  transition: 0.2s;
}
.demo-btn:hover {
  background: #d64c42;
  transform: translateY(-1px);
}

.leaves {
  position: absolute;
  width: 100%;
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 1;
  pointer-events: none;
}

.leaves .set {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
}

.leaves .set div {
  position: absolute;
  display: block;
}

.leaves .set div:nth-child(1) {
  left: 20%;
  animation: animate 20s linear infinite;
}

.leaves .set div:nth-child(2) {
  left: 50%;
  animation: animate 14s linear infinite;
}

.leaves .set div:nth-child(3) {
  left: 70%;
  animation: animate 12s linear infinite;
}

.leaves .set div:nth-child(4) {
  left: 5%;
  animation: animate 15s linear infinite;
}

.leaves .set div:nth-child(5) {
  left: 85%;
  animation: animate 18s linear infinite;
}

.leaves .set div:nth-child(6) {
  left: 90%;
  animation: animate 12s linear infinite;
}

.leaves .set div:nth-child(7) {
  left: 15%;
  animation: animate 14s linear infinite;
}

.leaves .set div:nth-child(8) {
  left: 60%;
  animation: animate 15s linear infinite;
}

@keyframes animate {
  0% {
    opacity: 0;
    top: -10%;
    transform: translateX(20px) rotate(0deg);
  }
  10% {
    opacity: 1;
  }
  20% {
    transform: translateX(-20px) rotate(45deg);
  }
  40% {
    transform: translateX(-20px) rotate(90deg);
  }
  60% {
    transform: translateX(20px) rotate(180deg);
  }
  80% {
    transform: translateX(-20px) rotate(45deg);
  }
  100% {
    top: 110%;
    transform: translateX(20px) rotate(225deg);
  }
}
  </style>
</head>

<body>
  <section>
    <div class="leaves">
      <div class="set">
        <div><img src="images/leaf_01.png" /></div>
        <div><img src="images/leaf_02.png" /></div>
        <div><img src="images/leaf_03.png" /></div>
        <div><img src="images/leaf_04.png" /></div>
        <div><img src="images/leaf_01.png" /></div>
        <div><img src="images/leaf_02.png" /></div>
        <div><img src="images/leaf_03.png" /></div>
        <div><img src="images/leaf_04.png" /></div>
      </div>
    </div>

    <img src="images/bg.jpg" class="bg" />
    <img src="images/girl.png" class="girl" />
    <img src="images/trees.png" class="trees" />

    <div class="login">
      <h2 id="loginTitle">SMS Pro Sign In</h2>
      <div class="inputBox">
        <input type="text" id="username" placeholder="Username" />
      </div>
      <div class="inputBox">
        <input type="password" id="password" placeholder="Password" />
      </div>
      <div class="inputBox">
        <input type="submit" value="Login" id="btn" />
      </div>

      <!-- Quick Demo Logins -->
      <div class="demo-box">
        <div class="demo-title">⚡ Quick 1-Click Demo Login</div>
        <div class="demo-buttons">
          <button type="button" class="demo-btn" onclick="quickFill('admin', 'admin123')">👑 Admin</button>
          <button type="button" class="demo-btn" onclick="quickFill('faculty', 'faculty123')">👩‍🏫 Faculty</button>
          <button type="button" class="demo-btn" onclick="quickFill('student', 'student123')">🎓 Student</button>
          <button type="button" class="demo-btn" onclick="quickFill('parent', 'parent123')">👨‍👧 Parent</button>
          <button type="button" class="demo-btn" onclick="quickFill('alumni', 'alumni123')">🌟 Alumni</button>
        </div>
      </div>

      <div class="group">
        <a href="#" onclick="alert('Demo passwords are: admin123, faculty123, student123, parent123, alumni123')">Forgot Password?</a>
        <a href="./signup.html">Create New Account</a>
      </div>
    </div>
  </section>

  <script>
  function quickFill(user, pass) {
    document.getElementById("username").value = user;
    document.getElementById("password").value = pass;
    document.getElementById("btn").click();
  }

  document.getElementById("btn").addEventListener("click", async function () {
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    if (!username || !password) {
      alert("Please enter both username and password.");
      return;
    }

    try {
      const data = await apiFetch('/auth/login', {
        method: 'POST',
        body: JSON.stringify({ username, password })
      });

      // ✅ Store login session info
      localStorage.setItem("loggedInUser", JSON.stringify(data.user));
      localStorage.setItem("token", data.token);
      localStorage.setItem("authenticated", "true");
      localStorage.setItem("userRole", data.user.role);
      localStorage.setItem("role", data.user.role);

      // ✅ Redirect to dashboard
      window.location.href = "dashboard.html";
    } catch (err) {
      alert(err.message);
    }
  });

  // Check if role was selected on index.html
  document.addEventListener("DOMContentLoaded", function () {
    const preselectedRole = localStorage.getItem("userRole");
    if (preselectedRole && !document.getElementById("username").value) {
      const passwords = { admin: 'admin123', faculty: 'faculty123', student: 'student123', parent: 'parent123', alumni: 'alumni123' };
      document.getElementById("username").value = preselectedRole;
      document.getElementById("password").value = passwords[preselectedRole] || '123456';
    }
  });
</script>

</body>
</html>

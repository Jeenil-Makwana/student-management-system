<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transportation Management | SMS Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-bottom: 40px;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    .disabled-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.75);
      z-index: 10;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #dc3545;
      border-radius: 8px;
    }
    .message {
      margin-top: 10px;
    }
  </style>
  <script src="assets/js/core.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
  <nav id="main-nav"></nav>
  <div class="container">
    <h2 class="text-center mb-4 font-bold">Campus Transportation Management</h2>

    <div class="position-relative" id="form-wrapper">
      <form id="transport-form" class="bg-white p-4 rounded shadow-sm border">
        <div class="row g-3">
          <div class="col-md-4">
            <label for="student-id-transport" class="form-label font-semibold">Student ID & Name</label>
            <input type="text" class="form-control" id="student-id-transport" placeholder="e.g. STD-2024-001 (Aarav Patel)" required>
          </div>
          <div class="col-md-4">
            <label for="route" class="form-label font-semibold">Assigned Route</label>
            <input type="text" class="form-control" id="route" placeholder="e.g. Route 4: North Express" required>
          </div>
          <div class="col-md-4">
            <label for="vehicle-no" class="form-label font-semibold">Vehicle / Bus Number</label>
            <input type="text" class="form-control" id="vehicle-no" placeholder="e.g. BUS-MH-02-AB-1204" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3 font-semibold">Assign Transport</button>
        <div id="form-message" class="text-success message"></div>
      </form>
    </div>

    <div class="input-group my-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by Student ID, Route, or Vehicle No...">
      <button class="btn btn-success" onclick="exportToCSV()">Export CSV</button>
    </div>

    <table class="table table-bordered table-hover bg-white shadow-sm" id="transport-table">
      <thead class="table-dark">
        <tr>
          <th onclick="sortTable(0)">Student ID / Name</th>
          <th onclick="sortTable(1)">Route</th>
          <th onclick="sortTable(2)">Vehicle / Bus No</th>
        </tr>
      </thead>
      <tbody>
        <!-- Records will be added dynamically -->
      </tbody>
    </table>
  </div>

  <script>
    const userRole = localStorage.getItem("userRole") || "student";
    const form = document.getElementById("transport-form");
    const formWrapper = document.getElementById("form-wrapper");
    const message = document.getElementById("form-message");

    if (userRole !== "admin") {
      formWrapper.style.display = "none";
      const notice = document.createElement("div");
      notice.className = "alert alert-info py-2 px-3 mb-4 d-flex justify-content-between align-items-center";
      notice.innerHTML = "<span><strong>🚌 Campus Transit Routes:</strong> View bus schedules, stops, and assigned vehicles</span><span class='badge bg-success'>Routes Active</span>";
      formWrapper.parentNode.insertBefore(notice, formWrapper);
    }

    function loadTransport() {
      const list = JSON.parse(localStorage.getItem("transportData")) || [];
      const tbody = document.querySelector("#transport-table tbody");
      tbody.innerHTML = "";

      list.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="fw-semibold">${item.studentId}</td>
          <td>${item.route}</td>
          <td><span class="badge bg-secondary font-monospace">${item.vehicleNo}</span></td>
        `;
        tbody.appendChild(row);
      });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const studentId = document.getElementById("student-id-transport").value.trim();
      const route = document.getElementById("route").value.trim();
      const vehicleNo = document.getElementById("vehicle-no").value.trim();

      let list = JSON.parse(localStorage.getItem("transportData")) || [];
      list.push({ studentId, route, vehicleNo });
      localStorage.setItem("transportData", JSON.stringify(list));

      loadTransport();
      message.textContent = "Transport assigned successfully!";
      form.reset();
      setTimeout(() => { message.textContent = ""; }, 2000);
    });

    document.getElementById("search-input").addEventListener("input", function () {
      const value = this.value.toLowerCase();
      document.querySelectorAll("#transport-table tbody tr").forEach(row => {
        row.style.display = [...row.cells].some(cell =>
          cell.textContent.toLowerCase().includes(value)
        ) ? "" : "none";
      });
    });

    function sortTable(colIndex) {
      const table = document.getElementById("transport-table");
      let switching = true, dir = "asc", switchcount = 0;
      while (switching) {
        switching = false;
        const rows = table.rows;
        for (let i = 1; i < rows.length - 1; i++) {
          let shouldSwitch = false;
          let x = rows[i].getElementsByTagName("TD")[colIndex];
          let y = rows[i + 1].getElementsByTagName("TD")[colIndex];
          let valX = x.innerText.toLowerCase();
          let valY = y.innerText.toLowerCase();
          if ((dir === "asc" && valX > valY) || (dir === "desc" && valX < valY)) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
          switching = true;
          switchcount++;
        } else if (switchcount === 0 && dir === "asc") {
          dir = "desc";
          switching = true;
        }
      }
    }

    function exportToCSV() {
      const rows = document.querySelectorAll("#transport-table tr");
      let csv = Array.from(rows).map(row =>
        Array.from(row.cells).map(cell => `"${cell.innerText}"`).join(",")
      ).join("\n");

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "transport_data.csv";
      a.click();
    }

    document.addEventListener("DOMContentLoaded", loadTransport);
  </script>
</body>
</html>

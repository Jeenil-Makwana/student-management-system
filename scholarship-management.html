<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scholarship Management | SMS Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding-bottom: 40px; }
        .container { max-width: 900px; margin: auto; }
        .form-control, .form-select { margin-bottom: 15px; }
        .disabled-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(255,255,255,0.75);
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .message { margin-top: 10px; }
    </style>
    <script src="assets/js/core.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
    <nav id="main-nav"></nav>
    <div class="container">
        <h2 class="text-center mb-4 font-bold">Scholarship & Financial Aid Management</h2>

        <div class="position-relative" id="form-wrapper">
            <form id="scholarship-form" class="p-4 bg-white rounded shadow-sm border">
                <label for="scholarship-name" class="form-label font-semibold">Scholarship / Award Name</label>
                <input type="text" class="form-control" id="scholarship-name" placeholder="e.g. Merit Fellowship" required>

                <label for="scholarship-amount" class="form-label font-semibold">Grant Amount (₹ INR)</label>
                <input type="number" class="form-control" id="scholarship-amount" placeholder="e.g. 50000" required>

                <button type="submit" class="btn btn-primary mt-2 font-semibold">Add Scholarship</button>
                <div id="form-message" class="text-success message"></div>
            </form>
        </div>

        <div class="input-group my-4">
            <input type="text" class="form-control" id="search-input" placeholder="Search by scholarship name or amount...">
            <button class="btn btn-success" onclick="exportToCSV()">Export CSV</button>
        </div>

        <table class="table table-bordered table-hover bg-white shadow-sm" id="scholarship-table">
            <thead class="table-dark">
                <tr>
                    <th onclick="sortTable(0)">Scholarship Name</th>
                    <th onclick="sortTable(1)">Amount (₹ INR)</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <script>
        const userRole = localStorage.getItem("userRole") || "student";
        const form = document.getElementById("scholarship-form");
        const formWrapper = document.getElementById("form-wrapper");
        const message = document.getElementById("form-message");

        if (userRole !== "admin" && userRole !== "faculty") {
            const overlay = document.createElement("div");
            overlay.className = "disabled-overlay";
            overlay.innerHTML = "<div class='text-danger text-center fw-bold'>View-only access. Switch role to Admin/Faculty to manage.</div>";
            formWrapper.appendChild(overlay);
            form.querySelectorAll("input, button").forEach(el => el.disabled = true);
        }

        function loadScholarships() {
            const list = JSON.parse(localStorage.getItem("scholarshipData")) || [];
            const tbody = document.querySelector("#scholarship-table tbody");
            tbody.innerHTML = "";

            list.forEach(item => {
                const row = document.createElement("tr");
                row.innerHTML = `<td class="fw-semibold">${item.name}</td><td class="text-success fw-bold">₹${Number(item.amount).toLocaleString('en-IN')}</td>`;
                tbody.appendChild(row);
            });
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const name = document.getElementById("scholarship-name").value.trim();
            const amount = document.getElementById("scholarship-amount").value.trim();

            if (!name || !amount) return;

            let list = JSON.parse(localStorage.getItem("scholarshipData")) || [];
            list.push({ name, amount });
            localStorage.setItem("scholarshipData", JSON.stringify(list));

            loadScholarships();
            message.textContent = "Scholarship added successfully!";
            form.reset();
            setTimeout(() => { message.textContent = ""; }, 2000);
        });

        document.getElementById("search-input").addEventListener("input", function () {
            const value = this.value.toLowerCase();
            document.querySelectorAll("#scholarship-table tbody tr").forEach(row => {
                row.style.display = [...row.cells].some(cell => cell.textContent.toLowerCase().includes(value)) ? "" : "none";
            });
        });

        function sortTable(colIndex) {
            const table = document.getElementById("scholarship-table");
            let switching = true, dir = "asc", switchcount = 0;

            while (switching) {
                switching = false;
                const rows = table.rows;
                for (let i = 1; i < rows.length - 1; i++) {
                    let shouldSwitch = false;
                    let x = rows[i].getElementsByTagName("TD")[colIndex];
                    let y = rows[i + 1].getElementsByTagName("TD")[colIndex];

                    let valX = isNaN(x.innerText.replace(/[₹,]/g, '')) ? x.innerText.toLowerCase() : parseFloat(x.innerText.replace(/[₹,]/g, ''));
                    let valY = isNaN(y.innerText.replace(/[₹,]/g, '')) ? y.innerText.toLowerCase() : parseFloat(y.innerText.replace(/[₹,]/g, ''));

                    if ((dir === "asc" && valX > valY) || (dir === "desc" && valX < valY)) {
                        shouldSwitch = true;
                        break;
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else if (switchcount === 0 && dir === "asc") {
                    dir = "desc";
                    switching = true;
                }
            }
        }

        function exportToCSV() {
            const rows = document.querySelectorAll("#scholarship-table tr");
            let csv = Array.from(rows).map(row =>
                Array.from(row.cells).map(cell => `"${cell.innerText}"`).join(",")
            ).join("\n");

            const blob = new Blob([csv], { type: 'text/csv' });
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "scholarship_records.csv";
            a.click();
        }

        document.addEventListener("DOMContentLoaded", loadScholarships);
    </script>
</body>
</html>

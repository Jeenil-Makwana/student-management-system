<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Result Processing System | SMS Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <script src="https://www.gstatic.com/charts/loader.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
      padding-bottom: 40px;
    }
    .table th {
      cursor: pointer;
    }
    #chart_div {
      margin-top: 30px;
    }
  </style>
  <script src="assets/js/core.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
  <nav id="main-nav"></nav>
  <div class="container">
    <h2 class="text-center mb-4 font-bold">Academic Result Processing Module</h2>

    <form id="result-processing-form" class="border p-4 bg-white rounded shadow-sm mb-4">
      <div class="row g-3">
        <div class="col-md-4">
          <label for="student-id-result" class="form-label font-semibold">Student ID</label>
          <input type="text" class="form-control" id="student-id-result" placeholder="e.g. STD-2024-001" required />
        </div>
        <div class="col-md-4">
          <label for="result-subject" class="form-label font-semibold">Subject Name</label>
          <input type="text" class="form-control" id="result-subject" placeholder="e.g. Data Structures" required />
        </div>
        <div class="col-md-4">
          <label for="marks-obtained" class="form-label font-semibold">Marks Obtained / Total</label>
          <input type="text" class="form-control" id="marks-obtained" placeholder="e.g. 48/50" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary mt-3 font-semibold">Add Academic Result</button>
    </form>

    <div class="mb-3 d-flex justify-content-between">
      <input type="text" class="form-control w-50" id="search-input" placeholder="Search by Student ID or Subject..." />
      <button class="btn btn-success ms-3" onclick="downloadCSV()">Export CSV</button>
    </div>

    <table class="table table-striped table-bordered table-hover bg-white shadow-sm" id="result-table">
      <thead class="table-dark">
        <tr>
          <th onclick="sortTable(0)">Student ID</th>
          <th onclick="sortTable(1)">Subject</th>
          <th onclick="sortTable(2)">Marks (Obtained / Total)</th>
          <th>Percentage</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody></tbody>
    </table>

    <div id="chart_div" style="height: 380px;"></div>
  </div>

  <script>
    let chartData = [['Subject', 'Marks']];
    let isGoogleChartsLoaded = false;

    function loadResults() {
      const results = JSON.parse(localStorage.getItem("resultProcessingData")) || [];
      const tbody = document.querySelector("#result-table tbody");
      tbody.innerHTML = "";
      chartData = [['Subject', 'Marks']];

      results.forEach(r => {
        const row = `
          <tr>
            <td class="font-monospace fw-bold">${r.studentId}</td>
            <td>${r.subject}</td>
            <td>${r.obtained}/${r.total}</td>
            <td><strong>${r.percentage}%</strong></td>
            <td><span class="badge ${r.status === 'Pass' ? 'bg-success' : 'bg-danger'}">${r.status}</span></td>
          </tr>
        `;
        tbody.insertAdjacentHTML('beforeend', row);
        chartData.push([r.subject, parseFloat(r.obtained)]);
      });

      if (isGoogleChartsLoaded) {
        drawChart();
      }
    }

    document.getElementById("result-processing-form").addEventListener("submit", function (e) {
      e.preventDefault();

      const studentId = document.getElementById("student-id-result").value.trim();
      const subject = document.getElementById("result-subject").value.trim();
      const marksInput = document.getElementById("marks-obtained").value.trim();
      const [obtained, total] = marksInput.split('/').map(Number);

      if (isNaN(obtained) || isNaN(total) || obtained > total) {
        alert("Please enter valid marks in format: obtained/total (e.g. 48/50)");
        return;
      }

      const percentage = ((obtained / total) * 100).toFixed(2);
      const status = percentage >= 35 ? "Pass" : "Fail";

      let list = JSON.parse(localStorage.getItem("resultProcessingData")) || [];
      list.push({ studentId, subject, obtained, total, percentage, status });
      localStorage.setItem("resultProcessingData", JSON.stringify(list));

      loadResults();
      document.getElementById("result-processing-form").reset();
    });

    function sortTable(n) {
      const table = document.getElementById("result-table");
      let switching = true, dir = "asc", switchcount = 0;
      while (switching) {
        switching = false;
        let rows = table.rows;
        for (let i = 1; i < (rows.length - 1); i++) {
          let x = rows[i].getElementsByTagName("TD")[n];
          let y = rows[i + 1].getElementsByTagName("TD")[n];
          let shouldSwitch = false;
          if (dir == "asc" ? x.innerText.toLowerCase() > y.innerText.toLowerCase()
                           : x.innerText.toLowerCase() < y.innerText.toLowerCase()) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
          switching = true;
          switchcount++;
        } else if (switchcount == 0 && dir == "asc") {
          dir = "desc";
          switching = true;
        }
      }
    }

    document.getElementById("search-input").addEventListener("input", function () {
      const search = this.value.toLowerCase();
      document.querySelectorAll("#result-table tbody tr").forEach(row => {
        const cells = Array.from(row.getElementsByTagName("td"));
        const match = cells.some(td => td.innerText.toLowerCase().includes(search));
        row.style.display = match ? "" : "none";
      });
    });

    function downloadCSV() {
      let csv = "Student ID,Subject,Marks Obtained,Percentage,Status\n";
      document.querySelectorAll("#result-table tbody tr").forEach(row => {
        const cols = row.querySelectorAll("td");
        const rowData = Array.from(cols).map(td => td.innerText).join(",");
        csv += rowData + "\n";
      });

      const blob = new Blob([csv], { type: "text/csv" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = "results.csv";
      link.click();
    }

    google.charts.load("current", { packages: ["corechart"] });
    google.charts.setOnLoadCallback(() => {
      isGoogleChartsLoaded = true;
      drawChart();
    });

    function drawChart() {
      if (chartData.length <= 1) return;
      const data = google.visualization.arrayToDataTable(chartData);
      const options = {
        title: "Subject Score Distribution",
        pieHole: 0.4,
        chartArea: { width: '85%', height: '80%' },
        colors: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#06b6d4', '#8b5cf6']
      };
      const chart = new google.visualization.PieChart(document.getElementById("chart_div"));
      chart.draw(data, options);
    }

    document.addEventListener("DOMContentLoaded", function () {
      const role = localStorage.getItem("userRole") || "student";
      const form = document.getElementById("result-processing-form");

      if (role !== "faculty" && role !== "admin") {
        form.style.display = "none";
        const notice = document.createElement("div");
        notice.className = "alert alert-info py-2 px-3 mb-4 d-flex justify-content-between align-items-center";
        notice.innerHTML = "<span><strong>👀 Read-Only Mode:</strong> Viewing Official Student Academic Results</span><span class='badge bg-success'>Processed</span>";
        form.parentNode.insertBefore(notice, form);
      }

      loadResults();
    });
  </script>
</body>
</html>

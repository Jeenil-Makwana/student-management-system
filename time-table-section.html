<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Time Table Management | SMS Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-bottom: 40px;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    .disabled-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.75);
      z-index: 10;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #dc3545;
      border-radius: 8px;
    }
    .message {
      margin-top: 10px;
    }
  </style>
  <script src="assets/js/core.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
  <nav id="main-nav"></nav>
  <div class="container">
    <h2 class="text-center mb-4 font-bold">Academic Schedule & Time Table</h2>

    <div class="position-relative" id="form-wrapper">
      <form id="time-table-form" class="bg-white p-4 rounded shadow-sm border">
        <div class="row g-3">
          <div class="col-md-6">
            <label for="day" class="form-label font-semibold">Day</label>
            <select class="form-select" id="day" required>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="time" class="form-label font-semibold">Time Slot</label>
            <input type="text" class="form-control" id="time" placeholder="e.g. 10:00 - 11:30 AM" required>
          </div>
          <div class="col-md-6">
            <label for="subject" class="form-label font-semibold">Subject / Course</label>
            <input type="text" class="form-control" id="subject" placeholder="e.g. Data Structures" required>
          </div>
          <div class="col-md-6">
            <label for="faculty" class="form-label font-semibold">Instructor / Faculty</label>
            <input type="text" class="form-control" id="faculty" placeholder="e.g. Dr. Rajesh Sharma" required>
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3 font-semibold">Add Class Schedule</button>
        <div id="form-message" class="text-success message"></div>
      </form>
    </div>

    <div class="input-group my-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by Day, Subject, or Faculty...">
      <button class="btn btn-success" onclick="exportToCSV()">Export CSV</button>
    </div>

    <table class="table table-bordered table-hover bg-white shadow-sm" id="time-table-table">
      <thead class="table-dark">
        <tr>
          <th onclick="sortTable(0)">Day</th>
          <th onclick="sortTable(1)">Time</th>
          <th onclick="sortTable(2)">Subject</th>
          <th onclick="sortTable(3)">Faculty</th>
        </tr>
      </thead>
      <tbody>
        <!-- Time table data here -->
      </tbody>
    </table>
  </div>

  <script>
    const userRole = localStorage.getItem("userRole") || "student";
    const form = document.getElementById("time-table-form");
    const formWrapper = document.getElementById("form-wrapper");
    const message = document.getElementById("form-message");

    if (userRole !== "admin" && userRole !== "faculty") {
      formWrapper.style.display = "none";
      const notice = document.createElement("div");
      notice.className = "alert alert-info py-2 px-3 mb-4 d-flex justify-content-between align-items-center";
      notice.innerHTML = "<span><strong>📅 Class Timetable:</strong> Weekly academic lecture schedule (Monday – Friday)</span><span class='badge bg-primary'>Current Term</span>";
      formWrapper.parentNode.insertBefore(notice, formWrapper);
    }

    function loadTimeTable() {
      let schedules = JSON.parse(localStorage.getItem("timeTableData")) || [];
      if (schedules.length === 0 && window.seedAllDemoData) {
        window.seedAllDemoData(false);
        schedules = JSON.parse(localStorage.getItem("timeTableData")) || [];
      }
      const tbody = document.querySelector("#time-table-table tbody");
      tbody.innerHTML = "";

      schedules.forEach(item => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="fw-bold">${item.day}</td>
          <td><span class="badge bg-primary text-white">${item.time}</span></td>
          <td class="fw-semibold">${item.subject}</td>
          <td>${item.faculty}</td>
        `;
        tbody.appendChild(row);
      });
    }

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const day = document.getElementById("day").value.trim();
      const time = document.getElementById("time").value.trim();
      const subject = document.getElementById("subject").value.trim();
      const faculty = document.getElementById("faculty").value.trim();

      let list = JSON.parse(localStorage.getItem("timeTableData")) || [];
      list.push({ day, time, subject, faculty });
      localStorage.setItem("timeTableData", JSON.stringify(list));

      loadTimeTable();
      message.textContent = "Schedule added successfully!";
      form.reset();
      setTimeout(() => { message.textContent = ""; }, 2000);
    });

    document.getElementById("search-input").addEventListener("input", function () {
      const value = this.value.toLowerCase();
      document.querySelectorAll("#time-table-table tbody tr").forEach(row => {
        row.style.display = [...row.cells].some(cell =>
          cell.textContent.toLowerCase().includes(value)
        ) ? "" : "none";
      });
    });

    function sortTable(colIndex) {
      const table = document.getElementById("time-table-table");
      let switching = true, dir = "asc", switchcount = 0;
      while (switching) {
        switching = false;
        const rows = table.rows;
        for (let i = 1; i < rows.length - 1; i++) {
          let shouldSwitch = false;
          let x = rows[i].getElementsByTagName("TD")[colIndex];
          let y = rows[i + 1].getElementsByTagName("TD")[colIndex];
          let valX = x.innerText.toLowerCase();
          let valY = y.innerText.toLowerCase();
          if ((dir === "asc" && valX > valY) || (dir === "desc" && valX < valY)) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
          switching = true;
          switchcount++;
        } else if (switchcount === 0 && dir === "asc") {
          dir = "desc";
          switching = true;
        }
      }
    }

    function exportToCSV() {
      const rows = document.querySelectorAll("#time-table-table tr");
      let csv = Array.from(rows).map(row =>
        Array.from(row.cells).map(cell => `"${cell.innerText}"`).join(",")
      ).join("\n");

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "time_table.csv";
      a.click();
    }

    document.addEventListener("DOMContentLoaded", loadTimeTable);
  </script>
</body>
</html>

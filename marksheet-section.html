<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marksheet Management System | SMS Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        body { background-color: #f8f9fa; padding-bottom: 40px; }
        .container { max-width: 960px; margin: auto; }
        .table thead th { cursor: pointer; }
        #chart_div { margin-top: 30px; }
    </style>
    <script src="assets/js/core.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
    <nav id="main-nav"></nav>
    <div class="container">
        <h2 class="text-center mb-4 font-bold">Marksheet Management System</h2>
        
        <form id="marksheet-form" class="border p-4 bg-white rounded shadow-sm mb-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <label for="student-id" class="form-label font-semibold">Student ID</label>
                    <input type="text" class="form-control" id="student-id" placeholder="e.g. STD-2024-001" required>
                </div>
                <div class="col-md-6">
                    <label for="subject" class="form-label font-semibold">Subject</label>
                    <input type="text" class="form-control" id="subject" placeholder="e.g. Data Structures" required>
                </div>
                <div class="col-md-6">
                    <label for="marks-obtained" class="form-label font-semibold">Marks Obtained</label>
                    <input type="number" class="form-control" id="marks-obtained" placeholder="e.g. 92" required>
                </div>
                <div class="col-md-6">
                    <label for="total-marks" class="form-label font-semibold">Total Marks</label>
                    <input type="number" class="form-control" id="total-marks" value="100" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary mt-3 font-semibold">Submit Marks</button>
        </form>

        <input type="text" class="form-control mb-3" id="search-input" placeholder="Search by Student ID or Subject...">

        <table class="table table-striped table-bordered table-hover" id="marksheet-table">
            <thead class="table-dark">
                <tr>
                    <th onclick="sortTable(0)">Student ID</th>
                    <th onclick="sortTable(1)">Subject</th>
                    <th onclick="sortTable(2)">Marks Obtained</th>
                    <th onclick="sortTable(3)">Total Marks</th>
                    <th>Percentage</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>

        <div id="chart_div" style="height: 380px;"></div>
    </div>

    <script>
        let chartData = [['Subject', 'Marks Obtained']];
        let isGoogleChartsLoaded = false;

        function loadMarksheets() {
            const marksheets = JSON.parse(localStorage.getItem("marksheetData")) || [];
            const tableBody = document.querySelector("#marksheet-table tbody");
            tableBody.innerHTML = "";
            chartData = [['Subject', 'Marks Obtained']];

            marksheets.forEach(m => {
                const row = tableBody.insertRow();
                row.innerHTML = `
                    <td class="font-monospace fw-bold">${m.studentId}</td>
                    <td>${m.subject}</td>
                    <td>${m.marksObtained}</td>
                    <td>${m.totalMarks}</td>
                    <td><span class="badge bg-success">${m.percentage}%</span></td>
                `;
                chartData.push([m.subject, parseFloat(m.marksObtained)]);
            });

            if (isGoogleChartsLoaded) {
                drawChart();
            }
        }

        document.getElementById("marksheet-form").addEventListener("submit", function (e) {
            e.preventDefault();
            const studentId = document.getElementById("student-id").value.trim();
            const subject = document.getElementById("subject").value.trim();
            const marksObtained = parseFloat(document.getElementById("marks-obtained").value);
            const totalMarks = parseFloat(document.getElementById("total-marks").value);
            const percentage = ((marksObtained / totalMarks) * 100).toFixed(2);

            let list = JSON.parse(localStorage.getItem("marksheetData")) || [];
            list.push({ studentId, subject, marksObtained, totalMarks, percentage });
            localStorage.setItem("marksheetData", JSON.stringify(list));

            loadMarksheets();
            document.getElementById("marksheet-form").reset();
            document.getElementById("total-marks").value = "100";
        });

        function sortTable(n) {
            const table = document.getElementById("marksheet-table");
            let rows, switching = true, dir = "asc", switchcount = 0;
            while (switching) {
                switching = false;
                rows = table.rows;
                for (let i = 1; i < (rows.length - 1); i++) {
                    let shouldSwitch = false;
                    let x = rows[i].getElementsByTagName("TD")[n];
                    let y = rows[i + 1].getElementsByTagName("TD")[n];
                    if (dir == "asc" ? x.innerHTML.toLowerCase() > y.innerHTML.toLowerCase() :
                                       x.innerHTML.toLowerCase() < y.innerHTML.toLowerCase()) {
                        shouldSwitch = true;
                        break;
                    }
                }
                if (shouldSwitch) {
                    rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
                    switching = true;
                    switchcount++;
                } else {
                    if (switchcount == 0 && dir == "asc") {
                        dir = "desc";
                        switching = true;
                    }
                }
            }
        }

        document.getElementById("search-input").addEventListener("input", function () {
            const searchTerm = this.value.toLowerCase();
            const rows = document.querySelectorAll("#marksheet-table tbody tr");
            rows.forEach(row => {
                const cells = row.getElementsByTagName("td");
                const match = [...cells].some(td => td.innerText.toLowerCase().includes(searchTerm));
                row.style.display = match ? "" : "none";
            });
        });

        google.charts.load('current', {packages: ['corechart']});
        google.charts.setOnLoadCallback(() => {
            isGoogleChartsLoaded = true;
            drawChart();
        });

        function drawChart() {
            if (chartData.length <= 1) return;
            const data = google.visualization.arrayToDataTable(chartData);
            const options = {
                title: 'Subject Performance Overview',
                pieHole: 0.4,
                chartArea: {width: '90%', height: '80%'},
                colors: ['#4f46e5', '#10b981', '#f59e0b', '#ef4444', '#8b5cf6', '#06b6d4']
            };
            const chart = new google.visualization.PieChart(document.getElementById('chart_div'));
            chart.draw(data, options);
        }

        document.addEventListener("DOMContentLoaded", function () {
            const userRole = localStorage.getItem("userRole");
            const form = document.getElementById("marksheet-form");
            if (userRole !== "faculty" && userRole !== "admin") {
                form.querySelectorAll("input, button").forEach(el => el.disabled = true);
                const notice = document.createElement("p");
                notice.textContent = "View-only access for your current role.";
                notice.className = "text-danger fw-bold mt-2";
                form.appendChild(notice);
            }
            loadMarksheets();
        });
    </script>
</body>
</html>

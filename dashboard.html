    /* Ambient Background Glow */

    }
    body.dark {
      background-color: #0b0f19;
      color: #f3f4f6;
    }

    .dark .hero-panel {

    }

    .light .hero-panel {
      background: linear-gradient(135deg, #ffffff, #f1f5f9);
      border-color: #e2e8f0;
    }

    /* Glassmorphism Card Style */
    .module-card {
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .module-card:hover {
      transform: translateY(-4px) scale(1.01);
      box-shadow: 0 20px 30px -10px rgba(79, 70, 229, 0.15), 0 0 0 1px rgba(99, 102, 241, 0.3);
    }
    .dark .module-card {
      background: rgba(17, 24, 39, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.07);
    }
    .dark .module-card:hover {
      background: rgba(31, 41, 55, 0.85);
      border-color: rgba(99, 102, 241, 0.4);
      box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.6), 0 0 20px 2px rgba(99, 102, 241, 0.2);
    }

    /* Category Pill Active */
    .filter-tab.active {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.35);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.3s ease-out forwards;
    }
  </style>

        icon: "👩‍🏫", 
        pillBg: "bg-emerald-600", 
        desc: "Instructional hub: take daily attendance, compute exam marks, update timetables, and send SMS alerts.",
        greeting: "Prof. Ananya Iyer"
      },
      student: { 
        name: "Student Scholar", 
        icon: "🎓", 
        pillBg: "bg-indigo-600", 
        desc: "Student self-services: view daily attendance, download QR ID cards, pay tuition fees, and canteen POS.",
        greeting: "Aarav Patel"
      },
      parent: { 
        name: "Parent & Guardian", 
        icon: "👨‍👧", 
        pillBg: "bg-amber-600", 
        desc: "Parental monitoring: review student attendance records, semester marksheets, transit and pay fees.",
        greeting: "Suresh Patel"
      },
      alumni: { 
        name: "Alumni Network", 
        icon: "🌟", 
        pillBg: "bg-purple-600", 
        desc: "Global graduate network: post corporate placement drives, mentor final-year students, and join galas.",
        greeting: "Neha Verma"
      }
    };

    const activeMeta = roleConfig[currentRole] || roleConfig.admin;

    // Populate Hero Header
    document.getElementById("roleHeaderBadge").textContent = activeMeta.name.toUpperCase();
    document.getElementById("userAvatarContainer").textContent = activeMeta.icon;
    document.getElementById("rolePillBadge").textContent = activeMeta.name.toUpperCase();
    document.getElementById("rolePillBadge").className = `text-xs font-black uppercase tracking-wider px-2.5 py-0.5 rounded-full ${activeMeta.pillBg} text-white shadow-xs`;

    const hour = new Date().getHours();
    const timeGreeting = hour < 12 ? 'Good Morning' : hour < 18 ? 'Good Afternoon' : 'Good Evening';
    document.getElementById("userGreetingText").textContent = `${timeGreeting}, ${loggedInUser.fullName || activeMeta.greeting}`;
    document.getElementById("roleDescriptionText").textContent = activeMeta.desc;

    // Role switcher dropdown synchronization
    const roleSelect = document.getElementById("dashboardRoleSelect");
    if (roleSelect) {
      roleSelect.value = currentRole;
      roleSelect.addEventListener("change", (e) => {
        const newRole = e.target.value;
        const users = JSON.parse(localStorage.getItem('users') || '[]');
        const matched = users.find(u => u.role === newRole) || { 
          fullName: roleConfig[newRole]?.greeting || (newRole.toUpperCase() + ' User'), 
          role: newRole, 
          username: newRole 
        };
        localStorage.setItem('userRole', newRole);
        localStorage.setItem('role', newRole);
        localStorage.setItem('loggedInUser', JSON.stringify(matched));
        window.location.reload();
      });
    }

    // Render Authorized Modules
    function renderModules(filter = "", category = "all") {
      const container = document.getElementById("modulesContainer");
      container.innerHTML = "";

      const authorizedModules = modules.filter(mod => {
        const isAuthorized = (currentRole === 'admin') || mod.roles.includes(currentRole);
        const matchesSearch = mod.title.toLowerCase().includes(filter.toLowerCase()) || mod.description.toLowerCase().includes(filter.toLowerCase());
        const matchesCategory = (category === 'all') || (mod.category === category);
        return isAuthorized && matchesSearch && matchesCategory;
      });

      document.getElementById("moduleCountDisplay").textContent = `${authorizedModules.length} Active Modules`;

      if (authorizedModules.length === 0) {
        container.innerHTML = `
          <div class="col-span-full text-center py-16 px-4">
            <div class="w-16 h-16 rounded-full bg-gray-100 dark:bg-gray-800 text-gray-400 mx-auto flex items-center justify-center text-2xl mb-3">🔍</div>
            <h3 class="text-base font-bold text-gray-700 dark:text-gray-300">No matching services found</h3>
            <p class="text-xs text-gray-400 mt-1">Try clearing your search query or switching category filter tab.</p>
          </div>
        `;
        return;
      }

      authorizedModules.forEach(mod => {
        const card = document.createElement("a");
        card.href = mod.href;
        card.className = "module-card rounded-2xl p-5 block relative border transition-all group bg-white dark:bg-gray-800 border-gray-200/80 dark:border-gray-700 shadow-xs";

        const badgeText = mod.tag[currentRole] || "Authorized";

        card.innerHTML = `
          <div class="flex items-center justify-between mb-4">
            <div class="w-11 h-11 rounded-xl bg-gradient-to-tr ${mod.iconColor} flex items-center justify-center text-white shadow-md shadow-indigo-500/15 group-hover:scale-110 transition-transform">
              <i data-feather="${mod.icon}" class="w-5 h-5"></i>
            </div>
            <span class="text-[10px] font-extrabold uppercase tracking-wider px-2.5 py-1 rounded-lg bg-gray-100 dark:bg-gray-700/60 text-gray-700 dark:text-gray-300 border border-gray-200/60 dark:border-gray-600/50 group-hover:border-indigo-500/40 group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors">
              ${badgeText}
            </span>
          </div>

          <h3 class="text-base font-extrabold text-gray-900 dark:text-white group-hover:text-indigo-600 dark:group-hover:text-indigo-400 transition-colors mb-1.5 flex items-center justify-between">
            <span>${mod.title}</span>
            <svg class="w-4 h-4 text-gray-400 group-hover:text-indigo-500 group-hover:translate-x-1 transition-all opacity-0 group-hover:opacity-100" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg>
          </h3>

          <p class="text-xs text-gray-500 dark:text-gray-400 line-clamp-2 leading-relaxed">
            ${mod.description}
          </p>
        `;

        container.appendChild(card);
      });

      feather.replace();
    }

    // Category Filter Handler
    function filterCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll(".filter-tab").forEach(tab => {
        tab.classList.remove("active", "bg-indigo-600", "text-white");
        tab.classList.add("bg-white", "dark:bg-gray-800", "text-gray-600", "dark:text-gray-300");
      });

      const activeTab = document.getElementById(`tab-${cat}`);
      if (activeTab) {
        activeTab.classList.add("active");
        activeTab.classList.remove("bg-white", "dark:bg-gray-800", "text-gray-600", "dark:text-gray-300");
      }

      renderModules(document.getElementById("searchBox").value, currentCategory);
    }

    // Search Input Listener
    const searchBox = document.getElementById("searchBox");
    searchBox.addEventListener("input", (e) => {
      renderModules(e.target.value, currentCategory);
    });

    // Keyboard shortcut (⌘K or /) to focus search
    window.addEventListener("keydown", (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'k' || e.key === '/') {
        e.preventDefault();
        searchBox.focus();
      }
    });

    // Logout Handler
    document.getElementById("logoutBtn").addEventListener("click", () => {
      localStorage.clear();
      window.location.href = "login.html";
    });

    // Dark Mode Theme Management
    const themeBtn = document.getElementById("themeToggleBtn");
    function applyTheme(isDark) {
      if (isDark) {
        document.documentElement.classList.add("dark");
        document.body.classList.add("dark");
        document.body.classList.remove("light");
        localStorage.setItem("sms_theme", "dark");
      } else {
        document.documentElement.classList.remove("dark");
        document.body.classList.remove("dark");
        document.body.classList.add("light");
        localStorage.setItem("sms_theme", "light");
      }
    }

    const savedTheme = localStorage.getItem("sms_theme") || "dark";
    applyTheme(savedTheme === "dark");

    themeBtn.addEventListener("click", () => {
      const isCurrentlyDark = document.body.classList.contains("dark");
      applyTheme(!isCurrentlyDark);
    });

    // Initial render
    renderModules("", "all");
  </script>
</body>
</html>

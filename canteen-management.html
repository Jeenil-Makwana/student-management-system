<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Canteen Management | SMS Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <script src="assets/js/core.js"></script>
</head>
<body class="bg-gray-50 dark:bg-gray-900 transition-colors duration-300">
  <nav id="main-nav"></nav>
  <div class="max-w-4xl mx-auto p-6 dark:text-white">
    <header class="mb-10">
        <h1 class="text-4xl font-black tracking-tight text-gray-900 dark:text-white">Campus Canteen & <span class="text-indigo-600">POS Hub</span></h1>
        <p class="text-gray-500 font-medium uppercase text-xs tracking-wider mt-1">Smart Campus Smart-Card & RFID Terminal</p>
    </header>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
      <!-- POS Transaction Section -->
      <div class="bg-white p-8 rounded-3xl shadow-xl dark:bg-gray-800 border border-gray-100 dark:border-gray-700 hover:border-indigo-500/30 transition-all">
        <h2 class="text-xl font-bold mb-6 flex items-center gap-2">
            <span class="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></span>
            <span>Live POS Terminal Charge</span>
        </h2>
        <div class="space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase text-gray-400 mb-2">Transaction Amount ($ / ₹)</label>
                <input type="number" id="amountInput" value="6.50" step="0.50" class="w-full p-4 bg-gray-50 dark:bg-gray-700 rounded-2xl font-black text-2xl border border-gray-200 dark:border-gray-600 focus:ring-2 focus:ring-indigo-500 outline-none">
            </div>
            <div class="p-6 bg-indigo-50 dark:bg-indigo-950/30 border border-indigo-100 dark:border-indigo-900/50 rounded-2xl">
                <p class="text-center text-xs font-bold uppercase text-indigo-600 dark:text-indigo-400 mb-4">Tap Student RFID / Smart Card</p>
                <button onclick="simulateScan('STD-2024-001 (Aarav Patel)')" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider hover:scale-[1.02] active:scale-[0.98] transition-all shadow-md shadow-indigo-500/20">
                    💳 Simulate Tap Card (Aarav Patel)
                </button>
            </div>
        </div>
      </div>

      <!-- Menu Management -->
      <div class="bg-white p-8 rounded-3xl shadow-xl dark:bg-gray-800 border border-gray-100 dark:border-gray-700 hover:border-emerald-500/30 transition-all">
        <h2 class="text-xl font-bold mb-6">Add Menu Item</h2>
        <form id="menu-form" class="space-y-4">
          <input type="text" id="itemName" placeholder="Item Name (e.g. Masala Dosa)" class="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl border border-gray-200 dark:border-gray-600 text-sm" required>
          <input type="number" id="price" placeholder="Price (e.g. 5.50)" step="0.25" class="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl border border-gray-200 dark:border-gray-600 text-sm" required>
          <select id="category" class="w-full p-3 bg-gray-50 dark:bg-gray-700 rounded-xl border border-gray-200 dark:border-gray-600 text-sm">
            <option value="Snack">Snack</option>
            <option value="Meal">Meal</option>
            <option value="Drink">Drink</option>
          </select>
          <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3 rounded-xl font-bold text-xs uppercase tracking-wider transition shadow-md">Add to Menu</button>
        </form>
      </div>
    </div>

    <div class="mt-10 bg-white dark:bg-gray-800 p-8 rounded-3xl shadow-xl border border-gray-100 dark:border-gray-700">
        <h2 class="text-xl font-bold mb-6">Current Canteen Inventory</h2>
        <div id="menu-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </div>
  </div>

  <script>
    const menuForm = document.getElementById('menu-form');
    const menuList = document.getElementById('menu-list');

    function simulateScan(studentId) {
        const amount = parseFloat(document.getElementById('amountInput').value) || 6.50;
        const fakeBalance = (150.00 - amount).toFixed(2);
        alert(`✅ POS PAYMENT SUCCESSFUL!\n\nStudent: ${studentId}\nAmount Charged: $${amount.toFixed(2)}\nTerminal: POS-CANTEEN-01\nRemaining Card Balance: $${fakeBalance}`);
    }

    async function loadMenu() {
      try {
        let items = (window.apiFetch ? await apiFetch('/canteen') : null) || JSON.parse(localStorage.getItem('/canteen') || '[]');
        if (items.length === 0 && window.seedAllDemoData) {
          window.seedAllDemoData(false);
          items = JSON.parse(localStorage.getItem('/canteen') || '[]');
        }
        menuList.innerHTML = items.map(item => `
          <div class="flex justify-between items-center p-4 bg-gray-50 dark:bg-gray-700/60 border border-gray-100 dark:border-gray-600/50 rounded-2xl">
            <div>
              <p class="font-bold text-sm text-gray-900 dark:text-white">${item.itemName}</p>
              <p class="text-xs text-indigo-600 dark:text-indigo-400 font-semibold uppercase mt-0.5">$${item.price} • ${item.category}</p>
            </div>
            <button onclick="deleteItem('${item._id}')" class="text-rose-500 font-bold text-xs uppercase hover:underline">Remove</button>
          </div>
        `).join('');
      } catch (err) {
        console.error(err);
      }
    }

    menuForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const itemName = document.getElementById('itemName').value;
      const price = document.getElementById('price').value;
      const category = document.getElementById('category').value;
      
      try {
        await apiFetch('/canteen', {
          method: 'POST',
          body: JSON.stringify({ itemName, price, category, availability: true })
        });
        menuForm.reset();
        loadMenu();
      } catch (err) {
        alert(err.message);
      }
    });

    async function deleteItem(id) {
      if (confirm('Are you sure you want to remove this item from the menu?')) {
        await apiFetch(`/canteen/${id}`, { method: 'DELETE' });
        loadMenu();
      }
    }

    loadMenu();
  </script>
</body>
</html>

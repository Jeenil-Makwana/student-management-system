<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Welcome | Student Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <script src="assets/js/core.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-indigo-700 via-purple-700 to-indigo-900 min-h-screen flex items-center justify-center px-4 py-8">
  <div class="bg-white/95 backdrop-blur-lg shadow-2xl rounded-2xl p-8 sm:p-10 max-w-3xl w-full text-center border border-white/40">
    <div class="inline-flex p-3 bg-indigo-100 text-indigo-700 rounded-2xl mb-4 shadow-sm">
      <svg class="w-10 h-10" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 14l9-5-9-5-9 5 9 5z"/><path d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
    </div>
    <h1 class="text-3xl sm:text-4xl font-black text-gray-900 mb-3 tracking-tight">Student Management System</h1>
    <p class="text-gray-600 mb-8 text-base sm:text-lg">Select your portal role to access authorized campus services & data</p>

    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4 mb-6">
      <button onclick="selectRole('admin')" class="bg-red-50 hover:bg-red-100 border border-red-200 transition-all transform hover:-translate-y-0.5 p-5 rounded-xl shadow-xs text-red-800 font-bold text-base flex flex-col items-center gap-2">
        <span class="text-2xl">👑</span>
        <span>Administrator</span>
      </button>
      <button onclick="selectRole('faculty')" class="bg-emerald-50 hover:bg-emerald-100 border border-emerald-200 transition-all transform hover:-translate-y-0.5 p-5 rounded-xl shadow-xs text-emerald-800 font-bold text-base flex flex-col items-center gap-2">
        <span class="text-2xl">👩‍🏫</span>
        <span>Faculty</span>
      </button>
      <button onclick="selectRole('student')" class="bg-indigo-50 hover:bg-indigo-100 border border-indigo-200 transition-all transform hover:-translate-y-0.5 p-5 rounded-xl shadow-xs text-indigo-800 font-bold text-base flex flex-col items-center gap-2">
        <span class="text-2xl">🎓</span>
        <span>Student</span>
      </button>
      <button onclick="selectRole('parent')" class="bg-amber-50 hover:bg-amber-100 border border-amber-200 transition-all transform hover:-translate-y-0.5 p-5 rounded-xl shadow-xs text-amber-800 font-bold text-base flex flex-col items-center gap-2">
        <span class="text-2xl">👨‍👧</span>
        <span>Parent</span>
      </button>
      <button onclick="selectRole('alumni')" class="bg-purple-50 hover:bg-purple-100 border border-purple-200 transition-all transform hover:-translate-y-0.5 p-5 rounded-xl shadow-xs text-purple-800 font-bold text-base flex flex-col items-center gap-2 col-span-2 sm:col-span-1">
        <span class="text-2xl">🌟</span>
        <span>Alumni</span>
      </button>
    </div>

    <p class="text-xs text-gray-400">&copy; 2026 Student Management System • Pro Edition</p>
  </div>

  <script>
    function selectRole(role) {
      localStorage.setItem('userRole', role);
      localStorage.setItem('role', role);
      window.location.href = "login.html";
    }
  </script>
</body>
</html>

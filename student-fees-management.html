<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Fees Management | SMS Pro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
      padding-bottom: 40px;
    }
    .container {
      max-width: 900px;
      margin: auto;
    }
    .disabled-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(255,255,255,0.75);
      z-index: 10;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      color: #dc3545;
      border-radius: 8px;
    }
    .message {
      margin-top: 10px;
    }
  </style>
  <script src="assets/js/core.js" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 transition-colors duration-300 dark:bg-gray-900 dark:text-gray-100">
  <nav id="main-nav"></nav>
  <div class="container">
    <h2 class="text-center mb-4 font-bold">Student Fees Management</h2>

    <div class="position-relative" id="form-wrapper">
      <form id="fees-form" class="bg-white p-4 rounded shadow-sm border">
        <label for="student-id-fees" class="form-label font-semibold">Student ID & Name</label>
        <input type="text" class="form-control" id="student-id-fees" placeholder="e.g. STD-2024-001 (Aarav Patel)" required>

        <label for="amount" class="form-label mt-3 font-semibold">Tuition / Fee Amount (₹ INR)</label>
        <input type="number" class="form-control" id="amount" placeholder="e.g. 65000" required>

        <button type="submit" class="btn btn-primary mt-3 font-semibold">Record Fee Payment</button>
        <div id="form-message" class="text-success message"></div>
      </form>
    </div>

    <div class="input-group my-4">
      <input type="text" class="form-control" id="search-input" placeholder="Search by Student ID, Name, or Amount...">
      <button class="btn btn-success" onclick="exportToCSV()">Export CSV</button>
    </div>

    <table class="table table-bordered table-hover bg-white shadow-sm" id="fees-table">
      <thead class="table-dark">
        <tr>
          <th onclick="sortTable(0)">Student ID / Name</th>
          <th onclick="sortTable(1)">Amount (₹ INR)</th>
          <th onclick="sortTable(2)">Date</th>
        </tr>
      </thead>
      <tbody>
        <!-- Fee records go here -->
      </tbody>
    </table>
  </div>

  <script>
    const userRole = localStorage.getItem("userRole") || "student";
    const form = document.getElementById("fees-form");
    const formWrapper = document.getElementById("form-wrapper");
    const message = document.getElementById("form-message");

    if (userRole !== "admin" && userRole !== "faculty") {
      const overlay = document.createElement("div");
      overlay.className = "disabled-overlay";
      overlay.innerText = "View-only access for current role. Switch role to Admin/Faculty to record payments.";
      formWrapper.appendChild(overlay);
      form.querySelectorAll("input, button").forEach(el => el.disabled = true);
    }

    function loadFees() {
      const fees = JSON.parse(localStorage.getItem("studentFeesData")) || [];
      const tbody = document.querySelector("#fees-table tbody");
      tbody.innerHTML = "";

      fees.forEach(f => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td class="fw-semibold font-monospace">${f.studentId}</td>
          <td class="text-success fw-bold">₹${Number(f.amount).toLocaleString('en-IN')}</td>
          <td>${f.date}</td>
        `;
        tbody.appendChild(row);
      });
    }

    form.addEventListener("submit", function (e) {
      e.preventDefault();
      const studentId = document.getElementById("student-id-fees").value.trim();
      const amount = document.getElementById("amount").value.trim();
      const date = new Date().toISOString().split('T')[0];

      if (!studentId || !amount) return;

      let list = JSON.parse(localStorage.getItem("studentFeesData")) || [];
      list.push({ studentId, amount, date });
      localStorage.setItem("studentFeesData", JSON.stringify(list));

      loadFees();
      message.textContent = "Fees recorded successfully!";
      form.reset();
      setTimeout(() => { message.textContent = ""; }, 2000);
    });

    document.getElementById("search-input").addEventListener("input", function () {
      const value = this.value.toLowerCase();
      document.querySelectorAll("#fees-table tbody tr").forEach(row => {
        row.style.display = [...row.cells].some(cell =>
          cell.textContent.toLowerCase().includes(value)
        ) ? "" : "none";
      });
    });

    function sortTable(colIndex) {
      const table = document.getElementById("fees-table");
      let switching = true, dir = "asc", switchcount = 0;
      while (switching) {
        switching = false;
        const rows = table.rows;
        for (let i = 1; i < rows.length - 1; i++) {
          let shouldSwitch = false;
          let x = rows[i].getElementsByTagName("TD")[colIndex];
          let y = rows[i + 1].getElementsByTagName("TD")[colIndex];
          let valX = isNaN(x.innerText.replace(/[₹,]/g, '')) ? x.innerText.toLowerCase() : parseFloat(x.innerText.replace(/[₹,]/g, ''));
          let valY = isNaN(y.innerText.replace(/[₹,]/g, '')) ? y.innerText.toLowerCase() : parseFloat(y.innerText.replace(/[₹,]/g, ''));
          if ((dir === "asc" && valX > valY) || (dir === "desc" && valX < valY)) {
            shouldSwitch = true;
            break;
          }
        }
        if (shouldSwitch) {
          rows[i].parentNode.insertBefore(rows[i + 1], rows[i]);
          switching = true;
          switchcount++;
        } else if (switchcount === 0 && dir === "asc") {
          dir = "desc";
          switching = true;
        }
      }
    }

    function exportToCSV() {
      const rows = document.querySelectorAll("#fees-table tr");
      let csv = Array.from(rows).map(row =>
        Array.from(row.cells).map(cell => `"${cell.innerText}"`).join(",")
      ).join("\n");

      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "student_fees_records.csv";
      a.click();
    }

    document.addEventListener("DOMContentLoaded", loadFees);
  </script>
</body>
</html>
